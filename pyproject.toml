[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asof"
version = "0.4.0.dev0"
description = "Point-in-time market intelligence, filing evidence, and paper portfolio simulation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md", "NOTICE"]
requires-python = ">=3.11"
authors = [
    {name = "Victor Jotham Ashioya", email = "ashioyajotham@icloud.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3.11"
]
dependencies = [
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "mypy",
    "flake8",
]
filings = [
    "pypdf>=5",
    "pypdfium2>=4",
]
model = ["llama-cpp-python>=0.3.6,<0.4"]

[project.scripts]
asof = "asof.cli:main"
asof-backtest = "asof.cli:backtest"

[tool.setuptools.packages.find]
include = ["asof*"]
namespaces = false

[tool.setuptools.package-data]
asof = ["fixtures/*/*"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
py_version = 311

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", ".git", "__pycache__"]
skips = ["B101", "B104"]
targets = ["asof"]

[tool.bandit.assert_used]
skips = ["test_*.py"]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fingpt_trader"
version = "0.2.0.dev0"
description = "Point-in-time financial research and paper portfolio simulation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Victor Jotham Ashioya", email = "ashioyajotham@icloud.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11"
]
dependencies = [
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "mypy",
    "flake8",
    "pytest-asyncio",
    "numpy", "pandas", "scipy", "aiohttp", "requests",
    "python-binance==1.0.27", "PyYAML", "rich", "python-dotenv"
]

model = ["llama-cpp-python>=0.3.6,<0.4"]
filings = ["pypdf[fonts]==6.21.4", "pypdfium2==5.15.2"]

[project.scripts]
fingpt-backtest = "fingpt_research.cli:backtest"
fingpt-trade = "fingpt_research.cli:main"
fingpt-analyze = "fingpt_research.cli:main"

[tool.setuptools.packages.find]
include = ["fingpt_research*"]
namespaces = false

[tool.setuptools.package-data]
fingpt_research = ["fixtures/*/*"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
py_version = 311

[tool.bandit]
exclude_dirs = ["tests", "venv", ".git", "__pycache__"]
skips = ["B101", "B104"]  # Skip assert statements and hardcoded bind
targets = ["fingpt_trader"]

[tool.bandit.assert_used]
skips = ["test_*.py"]

[tool.bandit.hardcoded_bind_all_interfaces]
skips = ["start_bot.py"]
